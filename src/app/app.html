<div class="conteiner">
    <div class="header">
        <h2 id="textHead">Angular list of prohibited words</h2>
    </div>
    <div class="place">
        <div class="box">
            <div class="box1">
                <h3 [style.color]="'black'" id="BadWord">Bad words: <span style="color: red;">  {{ badWord.join(' ') }}</span></h3>

                <!-- [style.color]="'black'" — задаёт чёрный цвет заголовку.
<span> — задаёт красный цвет только словам из массива.
{{ badWord.join(' ') }} — выводит слова через запятую. -->

            </div>
            <div class="box2">
                <input type="text" id="input" placeholder="word here...">
                <button id="add" #addButton (click)="getAdd(addButton)">Add</button>       
                <button id="reset" #resetButton (click)="getRes(resetButton)">Reset</button>
            </div>
            <div class="box3">
                <textarea id="textArea" style="height: 90px; width: 972px; resize: none;"
                    placeholder="text here..."></textarea>

            </div>
            <div class="box4">
                <button id="cenzor" #cenzorButton (click)="getCenzor(cenzorButton)">Cenzor</button>
            </div>
        </div>
    </div>
</div>
